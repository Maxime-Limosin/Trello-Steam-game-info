<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <img id="game-banner" alt="Steam Game Banner" />

  <script>
    const t = TrelloPowerUp.iframe()
    const imageUrl = t.arg('image')
    const gameName = t.arg('name')

    if (imageUrl) {
      const img = document.getElementById('game-banner')
      img.src = imageUrl
      img.alt = gameName || 'Steam Game'
    }
  </script>
</body>
</html>
